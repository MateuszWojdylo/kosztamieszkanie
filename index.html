<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Budżet Remontowy</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --success: #22c55e;
      --danger: #ef4444;
      --warning: #f59e0b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding-bottom: 60px;
    }

    /* Przyklejony nagłówek z łącznym kosztem w prawym górnym rogu */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
    }

    .topbar-inner {
      max-width: 960px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .brand h1 {
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-badges {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .sync-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.75rem;
      color: var(--muted);
      background: var(--card);
      border: 1px solid var(--border);
      padding: 3px 9px;
      border-radius: 999px;
      cursor: pointer;
      width: fit-content;
      transition: all 0.2s;
    }

    .sync-badge:hover {
      border-color: var(--accent);
      color: var(--text);
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--warning);
    }

    .dot.online {
      background: var(--success);
      box-shadow: 0 0 8px var(--success);
    }

    .dot.error {
      background: var(--danger);
    }

    .total-box {
      background: linear-gradient(135deg, #0284c7, #2563eb);
      padding: 8px 14px;
      border-radius: 12px;
      text-align: right;
      box-shadow: 0 4px 14px rgba(2, 132, 199, 0.3);
      flex-shrink: 0;
    }

    .total-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: rgba(255, 255, 255, 0.85);
      display: block;
    }

    .total-amount {
      font-size: 1.25rem;
      font-weight: 800;
      color: #ffffff;
      white-space: nowrap;
    }

    .container {
      max-width: 960px;
      margin: 20px auto 0;
      padding: 0 16px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
      transition: border-color 0.25s, box-shadow 0.25s;
    }

    .card.editing-mode {
      border-color: var(--warning);
      box-shadow: 0 0 0 2px rgba(245, 158, 11, 0.2), 0 4px 20px rgba(0, 0, 0, 0.3);
    }

    .card-title {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .editing-badge {
      display: none;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--warning);
      background: rgba(245, 158, 11, 0.15);
      border: 1px solid rgba(245, 158, 11, 0.35);
      padding: 3px 10px;
      border-radius: 999px;
    }

    .card.editing-mode .editing-badge {
      display: inline-block;
    }

    /* Formularz dodawania / edycji */
    .form-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }

    .form-actions {
      display: flex;
      gap: 8px;
    }

    @media (min-width: 640px) {
      .form-grid {
        grid-template-columns: 2fr 1fr auto;
        align-items: end;
      }
      .brand h1 {
        font-size: 1.35rem;
      }
      .total-amount {
        font-size: 1.5rem;
      }
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .field label {
      font-size: 0.8rem;
      color: var(--muted);
      font-weight: 500;
    }

    .field input {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 16px; /* Zapobiega przybliżaniu ekranu na iPhone */
      outline: none;
      transition: border-color 0.2s;
    }

    .field input:focus {
      border-color: var(--accent);
    }

    .card.editing-mode .field input:focus {
      border-color: var(--warning);
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 10px;
    }

    .chip {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 6px 11px;
      border-radius: 999px;
      font-size: 0.78rem;
      cursor: pointer;
      transition: all 0.15s;
    }

    .chip:hover, .chip:active {
      border-color: var(--accent);
      color: var(--text);
    }

    .btn-primary {
      flex: 1;
      background: var(--accent);
      color: #0f172a;
      font-weight: 700;
      font-size: 16px;
      border: none;
      border-radius: 10px;
      padding: 12px 20px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s, opacity 0.2s;
      height: 45px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      white-space: nowrap;
    }

    .btn-primary:hover {
      background: #7dd3fc;
    }

    .btn-primary.save-mode {
      background: var(--warning);
      color: #0f172a;
    }

    .btn-primary.save-mode:hover {
      background: #fbbf24;
    }

    .btn-primary.danger-mode {
      background: var(--danger);
      color: #ffffff;
    }

    .btn-primary.danger-mode:hover {
      background: #dc2626;
    }

    .btn-primary:active {
      transform: scale(0.98);
    }

    .btn-primary:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .btn-cancel {
      display: none;
      background: var(--bg);
      color: var(--muted);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0 14px;
      font-size: 0.9rem;
      font-weight: 600;
      height: 45px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-cancel:hover {
      color: var(--text);
      border-color: var(--muted);
    }

    .btn-cancel.visible {
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    /* Pasek narzędzi nad tabelą */
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .search-input {
      flex: 1;
      min-width: 180px;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 9px 12px;
      border-radius: 8px;
      font-size: 16px;
    }

    .toolbar-actions {
      display: flex;
      gap: 8px;
    }

    .btn-secondary {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.82rem;
      cursor: pointer;
    }

    .btn-secondary:hover {
      border-color: var(--accent);
    }

    /* Tabela wydatków */
    .table-wrap {
      width: 100%;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    th {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--muted);
      padding: 10px 8px;
      border-bottom: 1px solid var(--border);
    }

    td {
      padding: 12px 8px;
      border-bottom: 1px solid rgba(51, 65, 85, 0.6);
      font-size: 0.92rem;
      vertical-align: middle;
    }

    tr:last-child td {
      border-bottom: none;
    }

    tr.editing-row {
      background: rgba(245, 158, 11, 0.1);
    }

    .expense-title {
      font-weight: 600;
      color: var(--text);
      word-break: break-word;
    }

    .expense-date {
      font-size: 0.78rem;
      color: var(--muted);
    }

    .expense-amount {
      font-weight: 700;
      color: var(--accent);
      white-space: nowrap;
      text-align: right;
    }

    .row-actions {
      display: flex;
      justify-content: flex-end;
      gap: 6px;
      flex-wrap: nowrap;
    }

    .btn-edit {
      background: rgba(56, 189, 248, 0.12);
      color: #7dd3fc;
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 0.78rem;
      cursor: pointer;
      white-space: nowrap;
    }

    .btn-edit:hover {
      background: var(--accent);
      color: #0f172a;
    }

    .btn-delete {
      background: rgba(239, 68, 68, 0.12);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.3);
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 0.78rem;
      cursor: pointer;
      white-space: nowrap;
    }

    .btn-delete:hover {
      background: var(--danger);
      color: #fff;
    }

    @media (max-width: 480px) {
      td, th {
        padding: 10px 6px;
      }
      .btn-edit, .btn-delete {
        padding: 6px 8px;
        font-size: 0.74rem;
      }
    }

    .empty-state {
      text-align: center;
      padding: 28px 12px;
      color: var(--muted);
      font-size: 0.9rem;
    }

    /* Ekran blokady hasłem oraz Modal usuwania */
    .overlay {
      position: fixed;
      inset: 0;
      z-index: 999;
      background: rgba(15, 23, 42, 0.96);
      backdrop-filter: blur(14px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .overlay.hidden {
      display: none;
    }

    .modal-box {
      width: 100%;
      max-width: 400px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 24px 20px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      gap: 14px;
      text-align: center;
    }

    .modal-icon {
      font-size: 2.2rem;
      line-height: 1;
    }

    .modal-title {
      font-size: 1.2rem;
      font-weight: 700;
    }

    .modal-desc {
      font-size: 0.86rem;
      color: var(--muted);
      word-break: break-word;
    }

    .remember-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 0.84rem;
      color: var(--muted);
      cursor: pointer;
      user-select: none;
    }

    .remember-row input {
      width: 16px;
      height: 16px;
      accent-color: var(--accent);
    }

    .error-msg {
      color: #f87171;
      font-size: 0.82rem;
      font-weight: 600;
      min-height: 1.2em;
    }

    .modal-actions {
      display: flex;
      gap: 8px;
      margin-top: 4px;
    }
  </style>
</head>
<body>

  <!-- 1. EKRAN BLOKADY PRZY WEJŚCIU NA STRONĘ -->
  <div class="overlay" id="lockOverlay">
    <form class="modal-box" id="unlockForm">
      <div class="modal-icon">🔒</div>
      <div class="modal-title">Budżet Remontowy</div>
      <div class="modal-desc">Podaj hasło dostępu, aby wyświetlić i edytować wydatki.</div>
      <div class="field">
        <input type="password" id="accessPasswordInput" placeholder="Wpisz hasło dostępu..." autocomplete="current-password" required />
      </div>
      <label class="remember-row">
        <input type="checkbox" id="rememberDeviceCheckbox" checked />
        <span>Zapamiętaj mnie na tym urządzeniu</span>
      </label>
      <div class="error-msg" id="unlockError"></div>
      <button type="submit" class="btn-primary">Odblokuj stronę</button>
    </form>
  </div>

  <!-- 2. OKIENKO Z HASŁEM PRZY USUWANIU WYDATKU -->
  <div class="overlay hidden" id="deleteModal">
    <form class="modal-box" id="deleteConfirmForm">
      <div class="modal-icon">🗑️</div>
      <div class="modal-title">Potwierdź usunięcie</div>
      <div class="modal-desc" id="deleteItemName">Czy na pewno chcesz usunąć ten wydatek?</div>
      <div class="field">
        <input type="password" id="deletePasswordInput" placeholder="Podaj hasło usuwania..." required />
      </div>
      <div class="error-msg" id="deleteError"></div>
      <div class="modal-actions">
        <button type="button" class="btn-cancel visible" id="cancelDeleteBtn" style="flex:1;">Anuluj</button>
        <button type="submit" class="btn-primary danger-mode" style="flex:1;">Usuń wpis</button>
      </div>
    </form>
  </div>

  <!-- Nagłówek z łącznym kosztem w prawym górnym rogu -->
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <h1>🏠 Budżet Remontowy</h1>
        <div class="brand-badges">
          <button type="button" class="sync-badge" id="syncBadgeBtn" title="Kliknij, aby wymusić synchronizację">
            <span class="dot" id="syncDot"></span>
            <span id="syncText">Łączenie z bazą...</span>
          </button>
          <button type="button" class="sync-badge" id="lockPageBtn" title="Zablokuj stronę hasłem">
            🔒 Zablokuj
          </button>
        </div>
      </div>
      <div class="total-box">
        <span class="total-label">Łączny koszt</span>
        <span class="total-amount" id="totalAmount">0,00 zł</span>
      </div>
    </div>
  </header>

  <main class="container">

    <!-- Formularz dodawania / edycji wydatku -->
    <section class="card" id="formCard">
      <div class="card-title">
        <span id="formTitle">Dodaj nowy wydatek</span>
        <span class="editing-badge">Tryb edycji</span>
      </div>
      <form id="expenseForm" class="form-grid">
        <div class="field">
          <label for="titleInput">Tytuł wydatku</label>
          <input type="text" id="titleInput" placeholder="np. Panele podłogowe + podkład" required />
        </div>
        <div class="field">
          <label for="amountInput">Kwota (zł)</label>
          <input type="text" id="amountInput" inputmode="decimal" placeholder="np. 1450,00" required />
        </div>
        <div class="form-actions">
          <button type="submit" class="btn-primary" id="submitBtn">+ Dodaj</button>
          <button type="button" class="btn-cancel" id="cancelEditBtn">Anuluj</button>
        </div>
      </form>

      <div class="chips">
        <button type="button" class="chip" data-tag="Materiały: ">🧱 Materiały</button>
        <button type="button" class="chip" data-tag="Podłoga / Panele: ">🪵 Panele</button>
        <button type="button" class="chip" data-tag="Farby i chemia: ">🎨 Farby</button>
        <button type="button" class="chip" data-tag="Narzędzia: ">🛠️ Narzędzia</button>
        <button type="button" class="chip" data-tag="Robocizna: ">👷 Robocizna</button>
        <button type="button" class="chip" data-tag="Wyposażenie: ">🛋️ Wyposażenie</button>
      </div>
    </section>

    <!-- Tabela wydatków -->
    <section class="card">
      <div class="toolbar">
        <input type="search" id="searchInput" class="search-input" placeholder="Szukaj wydatku..." />
        <div class="toolbar-actions">
          <button type="button" class="btn-secondary" id="refreshBtn">🔄 Odśwież</button>
          <button type="button" class="btn-secondary" id="exportCsvBtn">📥 CSV</button>
        </div>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Nazwa wydatku</th>
              <th>Data dodania</th>
              <th style="text-align:right;">Kwota</th>
              <th style="text-align:right;">Akcja</th>
            </tr>
          </thead>
          <tbody id="expensesList"></tbody>
        </table>
        <div id="emptyState" class="empty-state">Zablokowano – podaj hasło.</div>
      </div>
    </section>

  </main>

  <script>
    // =========================================================================
    // USTAWIENIA HASEŁ (Zmień "1234" na własne hasła przed zapisaniem na GitHubie)
    // =========================================================================
    const ACCESS_PASSWORD = "7757"; // Hasło wymagane przy wejściu na stronę
    const DELETE_PASSWORD = "7757"; // Hasło wymagane przy usuwaniu wydatku

    // Twój adres bazy Firebase Realtime Database:
    const FIREBASE_DB_URL = "https://budzet-remontowy-default-rtdb.europe-west1.firebasedatabase.app";

    const LOCAL_KEY = "budzet_remontowy_wydatki_v1";
    const MIGRATED_FLAG = "budzet_remontowy_migrated_v1";
    const AUTH_STORAGE_KEY = "budzet_remontowy_unlocked_v1";

    let expenses = [];
    let isSyncing = false;
    let editingId = null;
    let pendingDeleteItem = null;
    let isUnlocked = false;

    const totalAmountEl = document.getElementById("totalAmount");
    const expensesListEl = document.getElementById("expensesList");
    const emptyStateEl = document.getElementById("emptyState");
    const formCard = document.getElementById("formCard");
    const formTitle = document.getElementById("formTitle");
    const expenseForm = document.getElementById("expenseForm");
    const titleInput = document.getElementById("titleInput");
    const amountInput = document.getElementById("amountInput");
    const submitBtn = document.getElementById("submitBtn");
    const cancelEditBtn = document.getElementById("cancelEditBtn");
    const searchInput = document.getElementById("searchInput");
    const syncDot = document.getElementById("syncDot");
    const syncText = document.getElementById("syncText");

    // Elementy blokady wejścia i usuwania
    const lockOverlay = document.getElementById("lockOverlay");
    const unlockForm = document.getElementById("unlockForm");
    const accessPasswordInput = document.getElementById("accessPasswordInput");
    const rememberDeviceCheckbox = document.getElementById("rememberDeviceCheckbox");
    const unlockError = document.getElementById("unlockError");
    const lockPageBtn = document.getElementById("lockPageBtn");

    const deleteModal = document.getElementById("deleteModal");
    const deleteConfirmForm = document.getElementById("deleteConfirmForm");
    const deleteItemName = document.getElementById("deleteItemName");
    const deletePasswordInput = document.getElementById("deletePasswordInput");
    const deleteError = document.getElementById("deleteError");
    const cancelDeleteBtn = document.getElementById("cancelDeleteBtn");

    function loadFromLocalStorage() {
      const possibleKeys = [
        LOCAL_KEY,
        "expenses",
        "remont_expenses",
        "remontWydatki",
        "budget_expenses",
        "wydatki_remontowe"
      ];
      for (const key of possibleKeys) {
        try {
          const raw = localStorage.getItem(key);
          if (raw) {
            const parsed = JSON.parse(raw);
            if (Array.isArray(parsed) && parsed.length > 0) {
              return parsed.map(item => ({
                id: String(item.id || Date.now() + Math.random()),
                title: item.title || item.name || item.tytul || "Wydatek",
                amount: Number(item.amount ?? item.value ?? item.kwota ?? 0),
                date: item.date || item.createdAt || item.data || new Date().toLocaleString("pl-PL")
              }));
            }
          }
        } catch (e) {}
      }
      return [];
    }

    function saveToLocalStorage(data) {
      localStorage.setItem(LOCAL_KEY, JSON.stringify(data));
    }

    function updateSyncStatus(state, message) {
      syncDot.classList.remove("online", "error");
      if (state === "online") {
        syncDot.classList.add("online");
      } else if (state === "error") {
        syncDot.classList.add("error");
      }
      syncText.textContent = message;
    }

    // =========================================================================
    // OBSŁUGA HASŁA WEJŚCIA NA STRONĘ
    // =========================================================================
    function unlockApp() {
      isUnlocked = true;
      lockOverlay.classList.add("hidden");
      unlockError.textContent = "";
      accessPasswordInput.value = "";
      syncWithCloud();
    }

    unlockForm.addEventListener("submit", (e) => {
      e.preventDefault();
      if (accessPasswordInput.value === ACCESS_PASSWORD) {
        if (rememberDeviceCheckbox.checked) {
          localStorage.setItem(AUTH_STORAGE_KEY, ACCESS_PASSWORD);
        } else {
          localStorage.removeItem(AUTH_STORAGE_KEY);
        }
        unlockApp();
      } else {
        unlockError.textContent = "Nieprawidłowe hasło dostępu!";
        accessPasswordInput.select();
      }
    });

    lockPageBtn.addEventListener("click", () => {
      isUnlocked = false;
      localStorage.removeItem(AUTH_STORAGE_KEY);
      lockOverlay.classList.remove("hidden");
      accessPasswordInput.value = "";
      setTimeout(() => accessPasswordInput.focus(), 100);
    });

    // =========================================================================
    // OBSŁUGA HASŁA PRZY USUWANIU WYDATKU
    // =========================================================================
    function openDeleteModal(item) {
      pendingDeleteItem = item;
      deleteItemName.textContent = `Wydatek: "${item.title}" (${formatCurrency(item.amount)})`;
      deletePasswordInput.value = "";
      deleteError.textContent = "";
      deleteModal.classList.remove("hidden");
      setTimeout(() => deletePasswordInput.focus(), 100);
    }

    function closeDeleteModal() {
      pendingDeleteItem = null;
      deletePasswordInput.value = "";
      deleteError.textContent = "";
      deleteModal.classList.add("hidden");
    }

    cancelDeleteBtn.addEventListener("click", closeDeleteModal);

    deleteConfirmForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      if (!pendingDeleteItem) return;

      if (deletePasswordInput.value !== DELETE_PASSWORD) {
        deleteError.textContent = "Błędne hasło usuwania!";
        deletePasswordInput.select();
        return;
      }

      const itemToDelete = pendingDeleteItem;
      closeDeleteModal();

      if (editingId && String(itemToDelete.id) === String(editingId)) {
        cancelEdit();
      }
      expenses = expenses.filter(exp => String(exp.id) !== String(itemToDelete.id));
      render();
      await pushToCloud(expenses);
    });

    // =========================================================================
    // EDYCJA I SYNCHRONIZACJA Z FIREBASE
    // =========================================================================
    function startEdit(item) {
      editingId = String(item.id);
      titleInput.value = item.title;
      amountInput.value = String(item.amount).replace(".", ",");

      formCard.classList.add("editing-mode");
      formTitle.textContent = "Edytuj wydatek";
      submitBtn.textContent = "💾 Zapisz";
      submitBtn.classList.add("save-mode");
      cancelEditBtn.classList.add("visible");

      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
      setTimeout(() => titleInput.focus(), 250);
    }

    function cancelEdit() {
      editingId = null;
      titleInput.value = "";
      amountInput.value = "";

      formCard.classList.remove("editing-mode");
      formTitle.textContent = "Dodaj nowy wydatek";
      submitBtn.textContent = "+ Dodaj";
      submitBtn.classList.remove("save-mode");
      cancelEditBtn.classList.remove("visible");

      render();
    }

    async function syncWithCloud() {
      if (!isUnlocked || isSyncing) return;
      isSyncing = true;

      try {
        const res = await fetch(`${FIREBASE_DB_URL}/wydatki.json?t=${Date.now()}`, {
          cache: "no-store"
        });
        if (!res.ok) throw new Error("Błąd HTTP: " + res.status);
        const cloudData = await res.json();

        let cloudList = [];
        if (Array.isArray(cloudData)) {
          cloudList = cloudData.filter(Boolean);
        } else if (cloudData && typeof cloudData === "object") {
          cloudList = Object.values(cloudData).filter(Boolean);
        }

        const alreadyMigrated = localStorage.getItem(MIGRATED_FLAG);
        if (!alreadyMigrated) {
          const localData = loadFromLocalStorage();
          if (localData.length > 0) {
            const existingIds = new Set(cloudList.map(i => String(i.id)));
            let addedAny = false;
            for (const loc of localData) {
              if (!existingIds.has(String(loc.id))) {
                cloudList.push(loc);
                addedAny = true;
              }
            }
            if (addedAny) {
              await pushToCloud(cloudList);
            }
          }
          localStorage.setItem(MIGRATED_FLAG, "true");
        }

        expenses = cloudList;
        saveToLocalStorage(expenses);
        updateSyncStatus("online", "Zsynchronizowano (PC + Telefon)");
        render();
      } catch (err) {
        expenses = loadFromLocalStorage();
        updateSyncStatus("error", "Tryb offline – sprawdź reguły bazy");
        render();
      } finally {
        isSyncing = false;
      }
    }

    async function pushToCloud(newList) {
      saveToLocalStorage(newList);
      try {
        const res = await fetch(`${FIREBASE_DB_URL}/wydatki.json`, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(newList)
        });
        if (!res.ok) throw new Error("Błąd zapisu");
        updateSyncStatus("online", "Zapisano w chmurze");
      } catch (err) {
        updateSyncStatus("error", "Błąd zapisu w chmurze");
      }
    }

    function formatCurrency(val) {
      return Number(val || 0).toLocaleString("pl-PL", {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      }) + " zł";
    }

    function render() {
      const query = searchInput.value.trim().toLowerCase();
      const total = expenses.reduce((sum, item) => sum + Number(item.amount || 0), 0);
      totalAmountEl.textContent = formatCurrency(total);

      const filtered = expenses
        .slice()
        .reverse()
        .filter(item => (item.title || "").toLowerCase().includes(query));

      expensesListEl.innerHTML = "";
      if (filtered.length === 0) {
        emptyStateEl.textContent = expenses.length === 0
          ? "Brak zapisanych wydatków. Dodaj pierwszą pozycję powyżej!"
          : "Brak wyników wyszukiwania.";
        emptyStateEl.style.display = "block";
        return;
      }
      emptyStateEl.style.display = "none";

      for (const item of filtered) {
        const tr = document.createElement("tr");
        if (editingId && String(item.id) === String(editingId)) {
          tr.className = "editing-row";
        }

        const tdTitle = document.createElement("td");
        tdTitle.className = "expense-title";
        tdTitle.textContent = item.title;

        const tdDate = document.createElement("td");
        tdDate.className = "expense-date";
        tdDate.textContent = item.date;

        const tdAmount = document.createElement("td");
        tdAmount.className = "expense-amount";
        tdAmount.textContent = formatCurrency(item.amount);

        const tdAction = document.createElement("td");
        tdAction.style.textAlign = "right";

        const actionsWrap = document.createElement("div");
        actionsWrap.className = "row-actions";

        const editBtn = document.createElement("button");
        editBtn.type = "button";
        editBtn.className = "btn-edit";
        editBtn.textContent = "Edytuj";
        editBtn.onclick = () => startEdit(item);

        const delBtn = document.createElement("button");
        delBtn.type = "button";
        delBtn.className = "btn-delete";
        delBtn.textContent = "Usuń";
        delBtn.onclick = () => openDeleteModal(item);

        actionsWrap.appendChild(editBtn);
        actionsWrap.appendChild(delBtn);
        tdAction.appendChild(actionsWrap);

        tr.appendChild(tdTitle);
        tr.appendChild(tdDate);
        tr.appendChild(tdAmount);
        tr.appendChild(tdAction);
        expensesListEl.appendChild(tr);
      }
    }

    expenseForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      if (!isUnlocked) return;

      const title = titleInput.value.trim();
      const rawAmount = amountInput.value.replace(/\s+/g, "").replace(",", ".");
      const amount = parseFloat(rawAmount);

      if (!title || isNaN(amount) || amount <= 0) {
        alert("Wpisz poprawny tytuł oraz kwotę większą od zera.");
        return;
      }

      const roundedAmount = Math.round(amount * 100) / 100;
      const currentEditingId = editingId;

      submitBtn.disabled = true;
      submitBtn.textContent = "Zapisywanie...";

      await syncWithCloud();

      if (currentEditingId) {
        const index = expenses.findIndex(item => String(item.id) === String(currentEditingId));
        if (index !== -1) {
          expenses[index].title = title;
          expenses[index].amount = roundedAmount;
        }
        cancelEdit();
      } else {
        const now = new Date();
        const dateStr = now.toLocaleDateString("pl-PL") + ", " + now.toLocaleTimeString("pl-PL", {
          hour: "2-digit",
          minute: "2-digit"
        });

        expenses.push({
          id: String(Date.now()),
          title,
          amount: roundedAmount,
          date: dateStr
        });

        titleInput.value = "";
        amountInput.value = "";
      }

      render();
      await pushToCloud(expenses);

      submitBtn.disabled = false;
      submitBtn.textContent = editingId ? "💾 Zapisz" : "+ Dodaj";
    });

    cancelEditBtn.addEventListener("click", cancelEdit);

    document.querySelectorAll(".chip").forEach(btn => {
      btn.addEventListener("click", () => {
        const tag = btn.getAttribute("data-tag");
        if (!titleInput.value.startsWith(tag)) {
          titleInput.value = tag + titleInput.value;
        }
        titleInput.focus();
      });
    });

    searchInput.addEventListener("input", render);
    document.getElementById("refreshBtn").addEventListener("click", syncWithCloud);
    document.getElementById("syncBadgeBtn").addEventListener("click", syncWithCloud);

    document.getElementById("exportCsvBtn").addEventListener("click", () => {
      if (expenses.length === 0) {
        alert("Brak wydatków do wyeksportowania.");
        return;
      }
      const rows = [["Tytuł wydatku", "Kwota (PLN)", "Data dodania"]];
      expenses.forEach(e => {
        rows.push([
          `"${String(e.title).replace(/"/g, '""')}"`,
          String(e.amount).replace(".", ","),
          `"${e.date}"`
        ]);
      });
      const csvContent = "\uFEFF" + rows.map(r => r.join(";")).join("\n");
      const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "wydatki-remontowe.csv";
      a.click();
    });

    // Sprawdzenie przy starcie, czy urządzenie było już odblokowane
    (function initAuth() {
      const savedPass = localStorage.getItem(AUTH_STORAGE_KEY);
      if (savedPass === ACCESS_PASSWORD) {
        unlockApp();
      } else {
        setTimeout(() => accessPasswordInput.focus(), 100);
      }
    })();

    window.addEventListener("focus", syncWithCloud);
    document.addEventListener("visibilitychange", () => {
      if (!document.hidden) syncWithCloud();
    });

    setInterval(() => {
      if (!document.hidden && !editingId && isUnlocked) syncWithCloud();
    }, 10000);
  </script>
</body>
</html>
