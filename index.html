<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Budżet Remontowy</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --success: #22c55e;
      --danger: #ef4444;
      --warning: #f59e0b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding-bottom: 60px;
    }

    /* Przyklejony nagłówek z łącznym kosztem w prawym górnym rogu */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
    }

    .topbar-inner {
      max-width: 960px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .brand h1 {
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .sync-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.75rem;
      color: var(--muted);
      background: var(--card);
      border: 1px solid var(--border);
      padding: 3px 9px;
      border-radius: 999px;
      cursor: pointer;
      width: fit-content;
      transition: all 0.2s;
    }

    .sync-badge:hover {
      border-color: var(--accent);
      color: var(--text);
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--warning);
    }

    .dot.online {
      background: var(--success);
      box-shadow: 0 0 8px var(--success);
    }

    .dot.error {
      background: var(--danger);
    }

    .total-box {
      background: linear-gradient(135deg, #0284c7, #2563eb);
      padding: 8px 14px;
      border-radius: 12px;
      text-align: right;
      box-shadow: 0 4px 14px rgba(2, 132, 199, 0.3);
      flex-shrink: 0;
    }

    .total-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: rgba(255, 255, 255, 0.85);
      display: block;
    }

    .total-amount {
      font-size: 1.25rem;
      font-weight: 800;
      color: #ffffff;
      white-space: nowrap;
    }

    .container {
      max-width: 960px;
      margin: 20px auto 0;
      padding: 0 16px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
    }

    .card-title {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* Formularz dodawania */
    .form-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }

    @media (min-width: 640px) {
      .form-grid {
        grid-template-columns: 2fr 1fr auto;
        align-items: end;
      }
      .brand h1 {
        font-size: 1.35rem;
      }
      .total-amount {
        font-size: 1.5rem;
      }
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .field label {
      font-size: 0.8rem;
      color: var(--muted);
      font-weight: 500;
    }

    .field input {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 16px; /* Zapobiega przybliżaniu ekranu na iPhone */
      outline: none;
      transition: border-color 0.2s;
    }

    .field input:focus {
      border-color: var(--accent);
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 10px;
    }

    .chip {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 6px 11px;
      border-radius: 999px;
      font-size: 0.78rem;
      cursor: pointer;
      transition: all 0.15s;
    }

    .chip:hover, .chip:active {
      border-color: var(--accent);
      color: var(--text);
    }

    .btn-primary {
      background: var(--accent);
      color: #0f172a;
      font-weight: 700;
      font-size: 16px;
      border: none;
      border-radius: 10px;
      padding: 12px 22px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s, opacity 0.2s;
      height: 45px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn-primary:hover {
      background: #7dd3fc;
    }

    .btn-primary:active {
      transform: scale(0.98);
    }

    .btn-primary:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    /* Pasek narzędzi nad tabelą */
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .search-input {
      flex: 1;
      min-width: 180px;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 9px 12px;
      border-radius: 8px;
      font-size: 16px;
    }

    .toolbar-actions {
      display: flex;
      gap: 8px;
    }

    .btn-secondary {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.82rem;
      cursor: pointer;
    }

    .btn-secondary:hover {
      border-color: var(--accent);
    }

    /* Tabela wydatków */
    .table-wrap {
      width: 100%;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    th {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--muted);
      padding: 10px 8px;
      border-bottom: 1px solid var(--border);
    }

    td {
      padding: 12px 8px;
      border-bottom: 1px solid rgba(51, 65, 85, 0.6);
      font-size: 0.92rem;
      vertical-align: middle;
    }

    tr:last-child td {
      border-bottom: none;
    }

    .expense-title {
      font-weight: 600;
      color: var(--text);
      word-break: break-word;
    }

    .expense-date {
      font-size: 0.78rem;
      color: var(--muted);
    }

    .expense-amount {
      font-weight: 700;
      color: var(--accent);
      white-space: nowrap;
      text-align: right;
    }

    .btn-delete {
      background: rgba(239, 68, 68, 0.12);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.3);
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 0.78rem;
      cursor: pointer;
    }

    .btn-delete:hover {
      background: var(--danger);
      color: #fff;
    }

    .empty-state {
      text-align: center;
      padding: 28px 12px;
      color: var(--muted);
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <!-- Nagłówek z łącznym kosztem w prawym górnym rogu -->
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <h1>🏠 Budżet Remontowy</h1>
        <button type="button" class="sync-badge" id="syncBadgeBtn" title="Kliknij, aby wymusić synchronizację">
          <span class="dot" id="syncDot"></span>
          <span id="syncText">Łączenie z bazą...</span>
        </button>
      </div>
      <div class="total-box">
        <span class="total-label">Łączny koszt</span>
        <span class="total-amount" id="totalAmount">0,00 zł</span>
      </div>
    </div>
  </header>

  <main class="container">

    <!-- Formularz dodawania wydatku -->
    <section class="card">
      <div class="card-title">Dodaj nowy wydatek</div>
      <form id="expenseForm" class="form-grid">
        <div class="field">
          <label for="titleInput">Tytuł wydatku</label>
          <input type="text" id="titleInput" placeholder="np. Panele podłogowe + podkład" required />
        </div>
        <div class="field">
          <label for="amountInput">Kwota (zł)</label>
          <input type="text" id="amountInput" inputmode="decimal" placeholder="np. 1450,00" required />
        </div>
        <button type="submit" class="btn-primary" id="submitBtn">+ Dodaj</button>
      </form>

      <div class="chips">
        <button type="button" class="chip" data-tag="Materiały: ">🧱 Materiały</button>
        <button type="button" class="chip" data-tag="Podłoga / Panele: ">🪵 Panele</button>
        <button type="button" class="chip" data-tag="Farby i chemia: ">🎨 Farby</button>
        <button type="button" class="chip" data-tag="Narzędzia: ">🛠️ Narzędzia</button>
        <button type="button" class="chip" data-tag="Robocizna: ">👷 Robocizna</button>
        <button type="button" class="chip" data-tag="Wyposażenie: ">🛋️ Wyposażenie</button>
      </div>
    </section>

    <!-- Tabela wydatków -->
    <section class="card">
      <div class="toolbar">
        <input type="search" id="searchInput" class="search-input" placeholder="Szukaj wydatku..." />
        <div class="toolbar-actions">
          <button type="button" class="btn-secondary" id="refreshBtn">🔄 Odśwież</button>
          <button type="button" class="btn-secondary" id="exportCsvBtn">📥 CSV</button>
        </div>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Nazwa wydatku</th>
              <th>Data dodania</th>
              <th style="text-align:right;">Kwota</th>
              <th style="text-align:right;">Akcja</th>
            </tr>
          </thead>
          <tbody id="expensesList"></tbody>
        </table>
        <div id="emptyState" class="empty-state">Ładowanie wydatków...</div>
      </div>
    </section>

  </main>

  <script>
    // Twój adres bazy Firebase Realtime Database wpisany na stałe:
    const FIREBASE_DB_URL = "https://budzet-remontowy-default-rtdb.europe-west1.firebasedatabase.app";

    const LOCAL_KEY = "budzet_remontowy_wydatki_v1";
    const MIGRATED_FLAG = "budzet_remontowy_migrated_v1";

    let expenses = [];
    let isSyncing = false;

    const totalAmountEl = document.getElementById("totalAmount");
    const expensesListEl = document.getElementById("expensesList");
    const emptyStateEl = document.getElementById("emptyState");
    const expenseForm = document.getElementById("expenseForm");
    const titleInput = document.getElementById("titleInput");
    const amountInput = document.getElementById("amountInput");
    const submitBtn = document.getElementById("submitBtn");
    const searchInput = document.getElementById("searchInput");
    const syncDot = document.getElementById("syncDot");
    const syncText = document.getElementById("syncText");

    // Odczyt z pamięci przeglądarki (przydatne przy pierwszej migracji lub braku zasięgu)
    function loadFromLocalStorage() {
      const possibleKeys = [
        LOCAL_KEY,
        "expenses",
        "remont_expenses",
        "remontWydatki",
        "budget_expenses",
        "wydatki_remontowe"
      ];
      for (const key of possibleKeys) {
        try {
          const raw = localStorage.getItem(key);
          if (raw) {
            const parsed = JSON.parse(raw);
            if (Array.isArray(parsed) && parsed.length > 0) {
              return parsed.map(item => ({
                id: String(item.id || Date.now() + Math.random()),
                title: item.title || item.name || item.tytul || "Wydatek",
                amount: Number(item.amount ?? item.value ?? item.kwota ?? 0),
                date: item.date || item.createdAt || item.data || new Date().toLocaleString("pl-PL")
              }));
            }
          }
        } catch (e) {}
      }
      return [];
    }

    function saveToLocalStorage(data) {
      localStorage.setItem(LOCAL_KEY, JSON.stringify(data));
    }

    function updateSyncStatus(state, message) {
      syncDot.classList.remove("online", "error");
      if (state === "online") {
        syncDot.classList.add("online");
      } else if (state === "error") {
        syncDot.classList.add("error");
      }
      syncText.textContent = message;
    }

    // Pobieranie danych z chmury Firebase
    async function syncWithCloud() {
      if (isSyncing) return;
      isSyncing = true;

      try {
        const res = await fetch(`${FIREBASE_DB_URL}/wydatki.json?t=${Date.now()}`, {
          cache: "no-store"
        });
        if (!res.ok) throw new Error("Błąd HTTP: " + res.status);
        const cloudData = await res.json();

        let cloudList = [];
        if (Array.isArray(cloudData)) {
          cloudList = cloudData.filter(Boolean);
        } else if (cloudData && typeof cloudData === "object") {
          cloudList = Object.values(cloudData).filter(Boolean);
        }

        // Jednorazowe przeniesienie wcześniejszych wpisów z telefonu do chmury
        const alreadyMigrated = localStorage.getItem(MIGRATED_FLAG);
        if (!alreadyMigrated) {
          const localData = loadFromLocalStorage();
          if (localData.length > 0) {
            const existingIds = new Set(cloudList.map(i => String(i.id)));
            let addedAny = false;
            for (const loc of localData) {
              if (!existingIds.has(String(loc.id))) {
                cloudList.push(loc);
                addedAny = true;
              }
            }
            if (addedAny) {
              await pushToCloud(cloudList);
            }
          }
          localStorage.setItem(MIGRATED_FLAG, "true");
        }

        expenses = cloudList;
        saveToLocalStorage(expenses);
        updateSyncStatus("online", "Zsynchronizowano (PC + Telefon)");
        render();
      } catch (err) {
        expenses = loadFromLocalStorage();
        updateSyncStatus("error", "Tryb offline – sprawdź reguły bazy");
        render();
      } finally {
        isSyncing = false;
      }
    }

    // Zapisywanie listy wydatków do chmury Firebase
    async function pushToCloud(newList) {
      saveToLocalStorage(newList);
      try {
        const res = await fetch(`${FIREBASE_DB_URL}/wydatki.json`, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(newList)
        });
        if (!res.ok) throw new Error("Błąd zapisu");
        updateSyncStatus("online", "Zapisano w chmurze");
      } catch (err) {
        updateSyncStatus("error", "Błąd zapisu w chmurze");
      }
    }

    function formatCurrency(val) {
      return Number(val || 0).toLocaleString("pl-PL", {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      }) + " zł";
    }

    function render() {
      const query = searchInput.value.trim().toLowerCase();
      const total = expenses.reduce((sum, item) => sum + Number(item.amount || 0), 0);
      totalAmountEl.textContent = formatCurrency(total);

      const filtered = expenses
        .slice()
        .reverse()
        .filter(item => (item.title || "").toLowerCase().includes(query));

      expensesListEl.innerHTML = "";
      if (filtered.length === 0) {
        emptyStateEl.textContent = expenses.length === 0
          ? "Brak zapisanych wydatków. Dodaj pierwszą pozycję powyżej!"
          : "Brak wyników wyszukiwania.";
        emptyStateEl.style.display = "block";
        return;
      }
      emptyStateEl.style.display = "none";

      for (const item of filtered) {
        const tr = document.createElement("tr");

        const tdTitle = document.createElement("td");
        tdTitle.className = "expense-title";
        tdTitle.textContent = item.title;

        const tdDate = document.createElement("td");
        tdDate.className = "expense-date";
        tdDate.textContent = item.date;

        const tdAmount = document.createElement("td");
        tdAmount.className = "expense-amount";
        tdAmount.textContent = formatCurrency(item.amount);

        const tdAction = document.createElement("td");
        tdAction.style.textAlign = "right";
        const delBtn = document.createElement("button");
        delBtn.className = "btn-delete";
        delBtn.textContent = "Usuń";
        delBtn.onclick = async () => {
          if (confirm(`Usunąć wydatek "${item.title}"?`)) {
            expenses = expenses.filter(e => String(e.id) !== String(item.id));
            render();
            await pushToCloud(expenses);
          }
        };
        tdAction.appendChild(delBtn);

        tr.appendChild(tdTitle);
        tr.appendChild(tdDate);
        tr.appendChild(tdAmount);
        tr.appendChild(tdAction);
        expensesListEl.appendChild(tr);
      }
    }

    // Dodawanie nowego wydatku
    expenseForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const title = titleInput.value.trim();
      const rawAmount = amountInput.value.replace(/\s+/g, "").replace(",", ".");
      const amount = parseFloat(rawAmount);

      if (!title || isNaN(amount) || amount <= 0) {
        alert("Wpisz poprawny tytuł oraz kwotę większą od zera.");
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = "Zapisywanie...";

      const now = new Date();
      const dateStr = now.toLocaleDateString("pl-PL") + ", " + now.toLocaleTimeString("pl-PL", {
        hour: "2-digit",
        minute: "2-digit"
      });

      const newExpense = {
        id: String(Date.now()),
        title,
        amount: Math.round(amount * 100) / 100,
        date: dateStr
      };

      await syncWithCloud();
      expenses.push(newExpense);
      titleInput.value = "";
      amountInput.value = "";
      render();
      await pushToCloud(expenses);

      submitBtn.disabled = false;
      submitBtn.textContent = "+ Dodaj";
    });

    // Szybkie podpowiedzi kategorii
    document.querySelectorAll(".chip").forEach(btn => {
      btn.addEventListener("click", () => {
        const tag = btn.getAttribute("data-tag");
        if (!titleInput.value.startsWith(tag)) {
          titleInput.value = tag + titleInput.value;
        }
        titleInput.focus();
      });
    });

    searchInput.addEventListener("input", render);
    document.getElementById("refreshBtn").addEventListener("click", syncWithCloud);
    document.getElementById("syncBadgeBtn").addEventListener("click", syncWithCloud);

    // Eksport do pliku CSV (Excel)
    document.getElementById("exportCsvBtn").addEventListener("click", () => {
      if (expenses.length === 0) {
        alert("Brak wydatków do wyeksportowania.");
        return;
      }
      const rows = [["Tytuł wydatku", "Kwota (PLN)", "Data dodania"]];
      expenses.forEach(e => {
        rows.push([
          `"${String(e.title).replace(/"/g, '""')}"`,
          String(e.amount).replace(".", ","),
          `"${e.date}"`
        ]);
      });
      const csvContent = "\uFEFF" + rows.map(r => r.join(";")).join("\n");
      const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "wydatki-remontowe.csv";
      a.click();
    });

    // Start aplikacji + automatyczna synchronizacja przy powrocie do karty i co 10 sekund
    syncWithCloud();

    window.addEventListener("focus", syncWithCloud);
    document.addEventListener("visibilitychange", () => {
      if (!document.hidden) syncWithCloud();
    });

    setInterval(() => {
      if (!document.hidden) syncWithCloud();
    }, 10000);
  </script>
</body>
</html>
